name: release
on:
  push:
    tags: ["v*"]

# Order matters: build → code-sign and notarize the macOS binaries → only then
# compute and sign SHA256SUMS (a code signature changes the file) → publish.
#
# Repo secrets:
#   BORDERCHECK_SIGNING_KEY       required. ed25519 key from `go run ./scripts/sign -keygen`; signs SHA256SUMS.
#   MACOS_CERTIFICATE_P12         optional. base64 of a .p12 holding the "Developer ID Application" certificate and its key.
#   MACOS_CERTIFICATE_PASSWORD    the .p12's password.
#   MACOS_SIGNING_IDENTITY        optional. e.g. "Developer ID Application: Sample Ltd (ABCDE12345)"; found in the .p12 when empty.
#   APPLE_NOTARY_KEY_P8           optional. Contents of an App Store Connect API key (AuthKey_XXXXXXXXXX.p8) for notarytool.
#   APPLE_NOTARY_KEY_ID           its key ID.
#   APPLE_NOTARY_ISSUER_ID        its issuer ID.
# Without the MACOS_* secrets the macOS job signs nothing and warns. The
# Developer ID key then stays on the maintainer's Mac: scripts/sign-macos-release.sh
# signs and notarizes the two macOS binaries there and leaves them in a draft
# release for this tag, and the release job below uses those instead of its own
# (only if they were built from exactly this commit) and publishes the draft.
# With neither, the release goes out with unsigned macOS binaries.
#
# Bordercheck.app, the app bordercheck's macOS notifications come from, is only
# ever built and signed on the maintainer's Mac (scripts/sign-macos-release.sh).
# The notifier job takes its zip from the draft and refuses it unless it is
# Developer ID signed with the hardened runtime, notarized and stapled,
# universal, and its Info.plist names exactly this commit, built from a clean
# tree, and this version. Without one the release goes out without it (and a
# warning): installed copies then keep showing notifications through osascript.

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - run: scripts/build-all.sh "$GITHUB_REF_NAME" --no-sums
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
          if-no-files-found: error

  macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/
      - name: Which signing secrets are set
        id: cfg
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          sign=no notarize=no
          [ -n "$P12" ] && sign=yes
          [ "$sign" = yes ] && [ -n "$NOTARY_KEY" ] && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER" ] && notarize=yes
          echo "sign=$sign" >>"$GITHUB_OUTPUT"
          echo "notarize=$notarize" >>"$GITHUB_OUTPUT"
          if [ "$sign" = no ]; then
            msg="MACOS_CERTIFICATE_P12 is not set: the macOS binaries are NOT code-signed or notarized. Gatekeeper blocks them when downloaded with a browser (install.sh and Homebrew are unaffected)."
            echo "::warning title=macOS binaries are NOT signed::$msg"
            printf '## :warning: macOS binaries are NOT signed\n\n%s\n' "$msg" >>"$GITHUB_STEP_SUMMARY"
          elif [ "$notarize" = no ]; then
            msg="The APPLE_NOTARY_* secrets are not all set: the macOS binaries are signed but NOT notarized, so Gatekeeper still blocks them when downloaded with a browser."
            echo "::warning title=macOS binaries are NOT notarized::$msg"
            printf '## :warning: macOS binaries are NOT notarized\n\n%s\n' "$msg" >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Import the Developer ID certificate into a throwaway keychain
        if: steps.cfg.outputs.sign == 'yes'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pw=$(openssl rand -base64 24)
          printf '%s' "$P12" | base64 --decode >"$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pw" "$keychain" >/dev/null
          # Search it, plus the keychains already there (for Apple's intermediate certificates).
          eval "set -- $(security list-keychains -d user | tr '\n' ' ')"
          security list-keychains -d user -s "$keychain" "$@"
          echo "KEYCHAIN=$keychain" >>"$GITHUB_ENV"

      - name: Code-sign the macOS binaries (hardened runtime, secure timestamp)
        if: steps.cfg.outputs.sign == 'yes'
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -eu
          if [ -z "$IDENTITY" ]; then
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          fi
          [ -n "$IDENTITY" ] || { echo "::error::No Developer ID Application identity in MACOS_CERTIFICATE_P12"; exit 1; }
          for f in dist/bordercheck-*-darwin-*; do
            codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --options runtime --timestamp \
              --identifier io.github.ptrinh.bordercheck "$f"
            codesign --verify --strict --verbose=2 "$f"
            codesign --display --verbose=2 "$f" 2>&1 | grep -E '^(Authority|TeamIdentifier|Timestamp|Runtime)'
          done
          # The runner is Apple silicon: the arm64 binary must still run once signed.
          chmod +x dist/bordercheck-*-darwin-*
          "dist/bordercheck-$GITHUB_REF_NAME-darwin-arm64" -version

      - name: Notarize the macOS binaries
        if: steps.cfg.outputs.notarize == 'yes'
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -eu
          key="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$NOTARY_KEY" >"$key"
          # A bare executable cannot be stapled; Gatekeeper looks the ticket up online.
          for f in dist/bordercheck-*-darwin-*; do
            zip="$RUNNER_TEMP/$(basename "$f").zip"
            ditto -c -k --keepParent "$f" "$zip"
            out=$(xcrun notarytool submit "$zip" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
              --wait --timeout 30m --output-format json)
            echo "$out"
            id=$(printf '%s' "$out" | jq -r .id)
            status=$(printf '%s' "$out" | jq -r .status)
            if [ "$status" != Accepted ]; then
              xcrun notarytool log "$id" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" || true
              echo "::error::Notarization of $(basename "$f") ended as $status"
              exit 1
            fi
          done

      - name: Remove the keychain
        if: always() && steps.cfg.outputs.sign == 'yes'
        run: security delete-keychain "$KEYCHAIN" || true

      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: dist/bordercheck-*-darwin-*
          if-no-files-found: error

  notifier:
    runs-on: macos-latest
    permissions:
      contents: write # only to see the draft release; this job writes nothing
    steps:
      - name: Take Bordercheck.app from the draft release and check it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p notifier
          touch notifier/.keep
          zip="bordercheck-notifier-$GITHUB_REF_NAME-darwin-universal.zip"
          draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$draft" != true ] || ! gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$zip" --dir notifier; then
            msg="No $zip in a draft release for $GITHUB_REF_NAME: this release has no notification app, so macOS installs keep showing notifications through osascript (Script Editor)."
            echo "::warning title=No macOS notification app::$msg"
            printf '## :warning: No macOS notification app\n\n%s\n' "$msg" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          fail() { echo "::error::$zip: $*"; rm -f "notifier/$zip"; exit 1; }
          # Only Bordercheck.app/... inside: no other paths, no links.
          if zipinfo -1 "notifier/$zip" | grep -qv '^Bordercheck\.app/'; then fail "has files outside Bordercheck.app"; fi
          work=$(mktemp -d)
          ditto -x -k "notifier/$zip" "$work"
          app="$work/Bordercheck.app"
          [ -z "$(find "$app" -type l)" ] || fail "has symbolic links"
          req='anchor apple generic and identifier "io.github.ptrinh.bordercheck.notifier" and certificate 1[field.1.2.840.113635.100.6.2.6] exists and certificate leaf[field.1.2.840.113635.100.6.1.13] exists'
          codesign --verify --strict --deep --verbose=2 --test-requirement "=$req" "$app" || fail "is not Developer ID signed as io.github.ptrinh.bordercheck.notifier"
          info=$(codesign --display --verbose=2 "$app" 2>&1)
          printf '%s\n' "$info" | grep -E '^(Identifier|Authority|TeamIdentifier|Timestamp|Runtime|Format)'
          printf '%s\n' "$info" | grep -q '^Runtime Version=' || fail "is not signed with the hardened runtime"
          xcrun stapler validate "$app" || fail "has no stapled notarization ticket"
          spctl --assess --type execute --verbose=2 "$app" || fail "is refused by Gatekeeper"
          plist="$app/Contents/Info.plist"
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist"; }
          [ "$(pb BCSourceCommit)" = "$GITHUB_SHA" ] || fail "was built from $(pb BCSourceCommit), not $GITHUB_SHA"
          [ "$(pb BCSourceTreeClean)" = true ] || fail "was built from a modified tree"
          [ "$(pb BCVersion)" = "$GITHUB_REF_NAME" ] || fail "is version $(pb BCVersion), not $GITHUB_REF_NAME"
          [ "$(pb CFBundleIdentifier)" = io.github.ptrinh.bordercheck.notifier ] || fail "has another bundle ID"
          archs=" $(lipo -archs "$app/Contents/MacOS/bordercheck-notifier") "
          case $archs in *" arm64 "*) ;; *) fail "has no arm64 code" ;; esac
          case $archs in *" x86_64 "*) ;; *) fail "has no x86_64 code" ;; esac
          # Signed by the same team as the macOS binaries in the draft.
          team=$(printf '%s\n' "$info" | sed -n 's/^TeamIdentifier=//p')
          if gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "bordercheck-$GITHUB_REF_NAME-darwin-arm64" --dir "$work"; then
            bin_team=$(codesign --display --verbose=2 "$work/bordercheck-$GITHUB_REF_NAME-darwin-arm64" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            [ "$bin_team" = "$team" ] || fail "is signed by team $team, the macOS binaries by $bin_team"
          fi
          echo "## macOS notification app: Developer ID ($team), notarized and stapled, built from $GITHUB_SHA" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: notifier
          path: notifier/
          include-hidden-files: true
          if-no-files-found: error

  release:
    needs: [macos, notifier]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: darwin
          path: darwin/
      - uses: actions/download-artifact@v4
        with:
          name: notifier
          path: notifier/
      - name: Take the macOS binaries from the signing job
        run: cp -f darwin/bordercheck-*-darwin-* dist/ && rm -rf darwin
      - name: Take the checked notification app, if there is one
        run: |
          zip="notifier/bordercheck-notifier-$GITHUB_REF_NAME-darwin-universal.zip"
          if [ -f "$zip" ]; then cp -f "$zip" dist/; fi
          rm -rf notifier
      - name: Use the macOS binaries signed on the maintainer's Mac, if a draft release holds them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$draft" != true ]; then
            echo "No draft release for $GITHUB_REF_NAME: using the macOS binaries from the macos job."
            exit 0
          fi
          mkdir presigned
          gh release download "$GITHUB_REF_NAME" --pattern "bordercheck-$GITHUB_REF_NAME-darwin-*" --dir presigned
          for arch in arm64 amd64; do
            f="presigned/bordercheck-$GITHUB_REF_NAME-darwin-$arch"
            test -s "$f"
            # Built from exactly this commit, with nothing uncommitted.
            info=$(go version -m "$f")
            printf '%s\n' "$info" | grep -q "vcs.revision=$GITHUB_SHA\$" || { echo "::error::$f was not built from $GITHUB_SHA"; exit 1; }
            printf '%s\n' "$info" | grep -q "vcs.modified=false\$" || { echo "::error::$f was built from a modified tree"; exit 1; }
            cp -f "$f" dist/
          done
          echo "PRESIGNED=yes" >>"$GITHUB_ENV"
          echo "## macOS binaries: signed and notarized on the maintainer's Mac (taken from the draft release)" >>"$GITHUB_STEP_SUMMARY"
      # SHA256SUMS.sig is what installed copies and the install scripts trust.
      - name: Write and sign SHA256SUMS
        run: test -n "$BORDERCHECK_SIGNING_KEY" && scripts/sums.sh && test -s dist/SHA256SUMS.sig
        env:
          BORDERCHECK_SIGNING_KEY: ${{ secrets.BORDERCHECK_SIGNING_KEY }}
      # Fails if the secret is not the key behind update.OfficialKey: such a
      # release would be refused by every installed copy and installer.
      - name: Check the release against the key built into bordercheck
        run: go run . verify dist/SHA256SUMS dist/SHA256SUMS.sig dist/bordercheck-*
      - name: Render the Homebrew formula
        run: scripts/homebrew-formula.sh "$GITHUB_REF_NAME" dist/SHA256SUMS "$GITHUB_REPOSITORY" >bordercheck.rb
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${PRESIGNED:-}" = yes ]; then
            gh release upload "$GITHUB_REF_NAME" dist/* bordercheck.rb --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          else
            gh release create "$GITHUB_REF_NAME" dist/* bordercheck.rb --title "$GITHUB_REF_NAME" --generate-notes
          fi
